<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MetroCarDeals — Review queue</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0d;color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;padding:24px 16px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#9a9aa2;font-size:13px;margin-bottom:24px}
  #gate{max-width:340px;margin:80px auto;text-align:center}
  #gate input{width:100%;padding:12px;font-size:15px;background:#1a1a1e;border:1px solid #3a3a42;color:#fff;border-radius:6px;margin-bottom:12px}
  #gate button{width:100%;padding:12px;font-size:14px;background:#c31834;color:#fff;border:0;border-radius:6px;cursor:pointer}
  [hidden]{display:none!important}
  .card{background:#17171b;border:1px solid #2c2c33;border-radius:10px;padding:18px;margin-bottom:18px;max-width:900px}
  .photos{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
  .photos img{height:160px;border-radius:6px;flex:none}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.5px;color:#9a9aa2}
  .fields input,.fields select{background:#1a1a1e;border:1px solid #3a3a42;color:#fff;padding:8px;border-radius:5px;font-size:13px}
  .caption{background:#1a1a1e;border:1px solid #2c2c33;border-radius:6px;padding:10px;font-size:12px;color:#c6c6cc;margin-bottom:14px;max-height:100px;overflow-y:auto;white-space:pre-wrap}
  .actions{display:flex;gap:10px}
  .actions button{padding:10px 18px;font-size:13px;border:0;border-radius:6px;cursor:pointer}
  .approve{background:#2e7d46;color:#fff}
  .reject{background:#2c2c33;color:#f2f2f2}
  .approve:disabled,.reject:disabled{opacity:.5;cursor:default}
  .empty{color:#9a9aa2;padding:40px 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5f4f1;color:#111;padding:10px 20px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.visible{opacity:1}
  a.src-link{color:#8fb8ff;font-size:12px}
</style>
</head>
<body>
  <div id="gate">
    <h1>MetroCarDeals review queue</h1>
    <p class="sub">Enter the admin key to continue.</p>
    <input id="keyInput" type="password" placeholder="Admin key" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
  </div>

  <div id="app" hidden>
    <h1>Review queue</h1>
    <p class="sub">New Instagram posts land here. Edit anything that's wrong, then approve to publish or reject to discard.</p>
    <div id="list"></div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
let adminKey = sessionStorage.getItem('metro-admin-key') || '';

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),2500);}

async function api(path, options={}){
  const res = await fetch(path, {
    ...options,
    headers: { 'x-admin-key': adminKey, 'Content-Type': 'application/json', ...(options.headers||{}) },
  });
  if (res.status === 401) throw new Error('unauthorized');
  if (!res.ok) throw new Error((await res.json().catch(()=>({error:res.statusText}))).error || 'Request failed');
  return res.json();
}

function fieldRow(label, name, value, type='text'){
  return `<label>${label}<input data-field="${name}" type="${type}" value="${value ?? ''}"></label>`;
}

function render(list){
  const container = $('#list');
  if (!list.length) { container.innerHTML = '<p class="empty">Nothing waiting for review.</p>'; return; }
  container.innerHTML = list.map(v => `
    <div class="card" data-id="${v.id}">
      <div class="photos">${(v.photos||[]).map(p=>`<img src="../${p.src}" alt="${p.label||''}">`).join('')}</div>
      <div class="fields">
        ${fieldRow('Make','make',v.make)}
        ${fieldRow('Model','model',v.model)}
        ${fieldRow('Year','year',v.year,'number')}
        ${fieldRow('Price (₦)','price',v.price,'number')}
        ${fieldRow('Type','type',v.type)}
        ${fieldRow('Condition','condition',v.condition)}
        ${fieldRow('Colour','color',v.color)}
        ${fieldRow('Tag','tag',v.tag)}
      </div>
      <div class="caption">${(v.rawCaption||'').replace(/</g,'&lt;')}</div>
      ${v.instagramSource ? `<p><a class="src-link" href="${v.instagramSource}" target="_blank" rel="noopener">View original post ↗</a></p>` : ''}
      <div class="actions">
        <button class="approve" data-action="approve">Approve & publish</button>
        <button class="reject" data-action="reject">Reject</button>
      </div>
    </div>
  `).join('');
}

async function load(){
  try {
    const list = await api('/api/pending');
    render(list);
  } catch (err) {
    if (err.message === 'unauthorized') { lock(); return; }
    $('#list').innerHTML = `<p class="empty">Could not load: ${err.message}</p>`;
  }
}

function lock(){
  sessionStorage.removeItem('metro-admin-key');
  $('#app').hidden = true;
  $('#gate').hidden = false;
}

function unlock(){
  adminKey = $('#keyInput').value.trim();
  if (!adminKey) return;
  sessionStorage.setItem('metro-admin-key', adminKey);
  $('#gate').hidden = true;
  $('#app').hidden = false;
  load();
}

$('#unlockBtn').addEventListener('click', unlock);
$('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  btn.disabled = true;
  try {
    if (btn.dataset.action === 'reject') {
      await api('/api/reject', { method: 'POST', body: JSON.stringify({ id }) });
      toast('Rejected');
      card.remove();
    } else {
      const edits = {};
      $$('[data-field]', card).forEach(input => {
        const val = input.type === 'number' ? Number(input.value) : input.value;
        edits[input.dataset.field] = val;
      });
      await api('/api/approve', { method: 'POST', body: JSON.stringify({ id, edits }) });
      toast('Published to the site');
      card.remove();
    }
    if (!$('#list').children.length) render([]);
  } catch (err) {
    toast('Error: ' + err.message);
    btn.disabled = false;
  }
});

if (adminKey) { $('#gate').hidden = true; $('#app').hidden = false; load(); }
</script>
</body>
</html>
