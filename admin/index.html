<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MetroCarDeals — Admin</title>
<link rel="icon" href="../assets/metrocardeals-icon.jpg">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0d;color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5}
  h1{font-size:19px;margin:0;font-weight:800}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;background:#1a1a1e;border:1px solid #3a3a42;color:#fff;padding:10px;border-radius:6px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid #ff596d;outline-offset:1px}
  label{display:block;font-size:11px;letter-spacing:.4px;color:#a5a5ad;margin-bottom:14px}
  label>span.field-label{display:block;margin-bottom:5px}

  #gate{max-width:340px;margin:100px auto;padding:0 20px;text-align:center}
  #gate input{margin-bottom:12px}
  #gate button{width:100%;padding:12px;font-size:14px;font-weight:700;background:#c31834;color:#fff;border:0;border-radius:6px}
  .error{color:#ff7a86;font-size:13px;margin-top:10px}
  [hidden]{display:none!important}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #232328;position:sticky;top:0;background:#0b0b0dee;backdrop-filter:blur(8px);z-index:5}
  header button{background:none;border:1px solid #3a3a42;color:#ddd;padding:8px 14px;border-radius:6px;font-size:12px}

  .tabs{display:flex;gap:4px;padding:12px 20px 0;overflow-x:auto}
  .tabs button{background:none;border:0;color:#8a8a92;padding:10px 14px;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:#fff;border-color:#c31834;font-weight:700}
  .badge{background:#c31834;color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;margin-left:6px}

  .tab-panel{display:none;padding:20px;max-width:900px;margin:0 auto}
  .tab-panel.active{display:block}

  .card{background:#151517;border:1px solid #232328;border-radius:10px;margin-bottom:16px;overflow:hidden}
  .card-top{display:flex;gap:14px;padding:14px}
  .card-thumb{width:88px;height:88px;flex-shrink:0;border-radius:6px;object-fit:cover;background:#232328}
  .card-info{flex:1;min-width:0}
  .card-info h3{margin:0 0 4px;font-size:16px}
  .card-info .price{font-weight:700;font-size:15px}
  .status-pill{display:inline-block;font-size:10px;letter-spacing:.5px;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .status-active{background:#1f3d2a;color:#5fd67f}
  .status-sold{background:#3d1f1f;color:#ff8f8f}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
  .card-actions button{background:#202024;border:1px solid #3a3a42;color:#eee;padding:8px 12px;border-radius:6px;font-size:12px}
  .card-actions button.danger{border-color:#5a2a2f;color:#ff8f8f}
  .card-actions button.primary{background:#c31834;border-color:#c31834;color:#fff}

  .edit-panel{border-top:1px solid #232328;padding:16px 14px;background:#111113}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.field-row{grid-template-columns:1fr}}

  .photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .photo-item{position:relative;width:84px;height:84px}
  .photo-item img{width:100%;height:100%;object-fit:cover;border-radius:6px}
  .photo-item button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#c31834;color:#fff;border:0;font-size:12px;line-height:1;padding:0}
  .upload-btn{display:inline-block;padding:10px 16px;background:#202024;border:1px dashed #4a4a52;border-radius:6px;font-size:12px;text-align:center;cursor:pointer;color:#ccc}
  .upload-btn input{display:none}

  .save-row{display:flex;gap:10px;margin-top:6px}
  .save-row button{padding:10px 18px;border-radius:6px;font-size:13px;border:0}
  .save-row .save{background:#2e7d46;color:#fff}
  .save-row .cancel{background:#2c2c33;color:#eee}

  .caption-box{background:#1a1a1e;border:1px solid #2c2c33;border-radius:6px;padding:10px;font-size:12px;color:#c6c6cc;max-height:100px;overflow-y:auto;white-space:pre-wrap;margin-bottom:14px}
  .empty{color:#8a8a92;padding:30px 0;text-align:center}
  .loading{color:#8a8a92;padding:30px 0;text-align:center}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5f4f1;color:#111;padding:10px 20px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
  #toast.visible{opacity:1}
</style>
</head>
<body>
  <div id="gate">
    <h1>MetroCarDeals admin</h1>
    <p style="color:#a5a5ad;font-size:13px;margin:10px 0 20px">Sign in to manage inventory.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="signInBtn">Sign in</button>
    <p id="gateError" class="error" hidden></p>
  </div>

  <div id="app" hidden>
    <header>
      <h1>MetroCarDeals admin</h1>
      <button id="signOutBtn">Sign out</button>
    </header>
    <nav class="tabs">
      <button data-tab="inventory" class="active">Inventory</button>
      <button data-tab="add">Add listing</button>
      <button data-tab="pending">Instagram queue<span id="pendingBadge" class="badge" hidden></span></button>
    </nav>

    <section id="tab-inventory" class="tab-panel active">
      <div id="inventoryList" class="loading">Loading…</div>
    </section>

    <section id="tab-add" class="tab-panel">
      <form id="addForm">
        <div class="field-row">
          <label><span class="field-label">Make</span><input name="make" required></label>
          <label><span class="field-label">Model</span><input name="model" required></label>
        </div>
        <div class="field-row">
          <label><span class="field-label">Year</span><input name="year" type="number"></label>
          <label><span class="field-label">Price (₦)</span><input name="price" type="number" required></label>
        </div>
        <div class="field-row">
          <label><span class="field-label">Type</span><select name="type"><option>SUV</option><option>Sedan</option></select></label>
          <label><span class="field-label">Condition</span><select name="condition"><option>Nigerian used</option><option>Foreign used</option><option>Brand new</option><option>Confirm condition</option></select></label>
        </div>
        <div class="field-row">
          <label><span class="field-label">Colour</span><input name="color" placeholder="Colour to confirm"></label>
          <label><span class="field-label">Tag</span><input name="tag" placeholder="NEW LISTING"></label>
        </div>
        <label><span class="field-label">Note</span><textarea name="note" rows="2"></textarea></label>
        <label><span class="field-label">Instagram link (optional)</span><input name="instagram_source" placeholder="https://www.instagram.com/p/..."></label>
        <label><span class="field-label">Photos</span>
          <div id="addPhotoGrid" class="photo-grid"></div>
          <label class="upload-btn">+ Add photos<input id="addPhotoInput" type="file" accept="image/*" multiple></label>
        </label>
        <div class="save-row"><button type="submit" class="save">Publish listing</button></div>
      </form>
    </section>

    <section id="tab-pending" class="tab-panel">
      <div id="pendingList" class="loading">Loading…</div>
    </section>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
